# ─── Root Query & Mutations ───────────────────────────────────────────────────

type Query {
  # Users
  user(id: ID!): User
  userByUsername(username: String!): User
  users(page: Int, perPage: Int, inTeam: ID, inChannel: ID, notInChannel: ID, notInTeam: ID, roles: String): [User!]!
  me: User

  # Teams
  team(id: ID!): Team
  teams(page: Int, perPage: Int): [Team!]!
  teamByName(name: String!): Team
  teamMembers(teamId: ID!, page: Int, perPage: Int): [TeamMember!]!
  teamStats(teamId: ID!): TeamStats

  # Channels
  channel(id: ID!): Channel
  channels(teamId: ID!, page: Int, perPage: Int): [Channel!]!
  channelByName(teamId: ID!, name: String!): Channel
  channelMembers(channelId: ID!, page: Int, perPage: Int): [ChannelMember!]!
  channelStats(channelId: ID!): ChannelStats
  directChannels(userId: ID!): [Channel!]!

  # Posts
  post(id: ID!): Post
  postsForChannel(channelId: ID!, page: Int, perPage: Int, since: DateTime, before: ID, after: ID): [Post!]!
  postsSearch(teamId: ID!, terms: String!, isOrSearch: Boolean, timeZoneOffset: Int, includeDeletedChannels: Boolean, page: Int, perPage: Int): [Post!]!

  # Threads
  thread(threadId: ID!, teamId: ID!, userId: ID!): Thread
  threadsForUser(userId: ID!, teamId: ID!, page: Int, perPage: Int): [Thread!]!

  # Files
  file(fileId: ID!): FileAttachment
  filesForPost(postId: ID!): [FileAttachment!]!

  # Roles
  role(id: ID!): Role
  roleByName(name: String!): Role
  roles(page: Int, perPage: Int): [Role!]!

  # Schemes
  scheme(id: ID!): Scheme
  schemes(scope: SchemeScope, page: Int, perPage: Int): [Scheme!]!

  # Emoji
  emoji(id: ID!): Emoji
  emojis(page: Int, perPage: Int, sort: String): [Emoji!]!

  # Webhooks
  incomingWebhook(hookId: ID!): IncomingWebhook
  incomingWebhooks(teamId: ID, page: Int, perPage: Int): [IncomingWebhook!]!
  outgoingWebhook(hookId: ID!): OutgoingWebhook
  outgoingWebhooks(teamId: ID!, channelId: ID, page: Int, perPage: Int): [OutgoingWebhook!]!

  # Commands
  command(commandId: ID!): Command
  commands(teamId: ID, customOnly: Boolean, page: Int, perPage: Int): [Command!]!

  # OAuth
  oauthApp(appId: ID!): OAuth2App
  oauthApps(page: Int, perPage: Int): [OAuth2App!]!

  # Plugins
  plugin(pluginId: ID!): Plugin
  plugins: [Plugin!]!

  # Groups
  group(groupId: ID!): Group
  groups(page: Int, perPage: Int, q: String, notAssociatedToTeam: ID, notAssociatedToChannel: ID, includeTimezones: Boolean, filterAllowReference: Boolean): [Group!]!

  # Bots
  bot(userId: ID!): Bot
  bots(page: Int, perPage: Int, includeDeleted: Boolean, onlyOrphaned: Boolean): [Bot!]!

  # Audit
  audits(userId: ID, page: Int, perPage: Int): [Audit!]!

  # Compliance
  compliances: [Compliance!]!

  # System
  systemInfo: SystemInfo
  config: Config
  logs(page: Int, perPage: Int, logFile: String): [Log!]!

  # Statuses
  status(userId: ID!): Status
  statuses(userIds: [ID!]!): [Status!]!

  # Preferences
  preferences(userId: ID!, category: String): [Preference!]!

  # Shared Channels
  sharedChannel(channelId: ID!): SharedChannel
  sharedChannels(teamId: ID!, page: Int, perPage: Int): [SharedChannel!]!
  remoteClusters: [RemoteCluster!]!

  # Playbooks
  playbook(id: ID!): Playbook
  playbooks(teamId: ID!, page: Int, perPage: Int, sort: String, direction: String): [Playbook!]!
  playbookRun(id: ID!): PlaybookRun
  playbookRuns(teamId: ID!, playbookId: ID, status: String, ownerUserId: ID, page: Int, perPage: Int, sort: String, direction: String): [PlaybookRun!]!

  # Cloud
  cloudSubscription: CloudSubscription
  cloudCustomer: CloudCustomer

  # Import/Export
  imports: [Import!]!
  exports: [Export!]!
}

type Mutation {
  # Users
  createUser(user: UserInput!): User!
  updateUser(id: ID!, user: UserInput!): User!
  deleteUser(id: ID!): Boolean!
  updateUserRoles(userId: ID!, roles: String!): Boolean!
  updateUserPassword(userId: ID!, currentPassword: String, newPassword: String!): Boolean!
  createUserAccessToken(userId: ID!, description: String!): UserSession!
  revokeUserSession(userId: ID!, sessionId: ID!): Boolean!

  # Teams
  createTeam(team: TeamInput!): Team!
  updateTeam(id: ID!, team: TeamInput!): Team!
  deleteTeam(id: ID!): Boolean!
  addTeamMember(teamId: ID!, userId: ID!, roles: String): TeamMember!
  removeTeamMember(teamId: ID!, userId: ID!): Boolean!

  # Channels
  createChannel(channel: ChannelInput!): Channel!
  updateChannel(id: ID!, channel: ChannelInput!): Channel!
  deleteChannel(id: ID!): Boolean!
  addChannelMember(channelId: ID!, userId: ID!, postRootId: String): ChannelMember!
  removeChannelMember(channelId: ID!, userId: ID!): Boolean!
  createDirectChannel(userIds: [ID!]!): Channel!
  createGroupChannel(userIds: [ID!]!): Channel!

  # Posts
  createPost(post: PostInput!): Post!
  updatePost(id: ID!, post: PostInput!): Post!
  deletePost(id: ID!): Boolean!
  pinPost(postId: ID!): Boolean!
  unpinPost(postId: ID!): Boolean!

  # Reactions
  addReaction(userId: ID!, postId: ID!, emojiName: String!): Reaction!
  removeReaction(userId: ID!, postId: ID!, emojiName: String!): Boolean!

  # Files
  uploadFile(channelId: ID!, file: Upload!): FileAttachment!

  # Threads
  followThread(userId: ID!, teamId: ID!, threadId: ID!): Boolean!
  unfollowThread(userId: ID!, teamId: ID!, threadId: ID!): Boolean!
  updateThreadRead(userId: ID!, teamId: ID!, threadId: ID!, timestamp: DateTime!): Boolean!

  # Roles
  updateRole(id: ID!, permissions: [String!]!): Role!

  # Emoji
  createEmoji(emoji: EmojiInput!, image: Upload!): Emoji!
  deleteEmoji(emojiId: ID!): Boolean!

  # Webhooks
  createIncomingWebhook(hook: IncomingWebhookInput!): IncomingWebhook!
  updateIncomingWebhook(hookId: ID!, hook: IncomingWebhookInput!): IncomingWebhook!
  deleteIncomingWebhook(hookId: ID!): Boolean!
  createOutgoingWebhook(hook: OutgoingWebhookInput!): OutgoingWebhook!
  deleteOutgoingWebhook(hookId: ID!): Boolean!

  # Commands
  createCommand(command: CommandInput!): Command!
  updateCommand(commandId: ID!, command: CommandInput!): Command!
  deleteCommand(commandId: ID!): Boolean!

  # OAuth
  createOAuthApp(app: OAuth2AppInput!): OAuth2App!
  updateOAuthApp(appId: ID!, app: OAuth2AppInput!): OAuth2App!
  deleteOAuthApp(appId: ID!): Boolean!

  # Plugins
  enablePlugin(pluginId: ID!): Boolean!
  disablePlugin(pluginId: ID!): Boolean!
  removePlugin(pluginId: ID!): Boolean!

  # Bots
  createBot(bot: BotInput!): Bot!
  updateBot(userId: ID!, bot: BotInput!): Bot!
  disableBot(userId: ID!): Bot!
  enableBot(userId: ID!): Bot!

  # Config
  updateConfig(config: JSON!): Config!

  # Status
  updateStatus(userId: ID!, status: String!, dndEndTime: DateTime): Status!

  # Preferences
  updatePreferences(userId: ID!, preferences: [PreferenceInput!]!): Boolean!
  deletePreferences(userId: ID!, preferences: [PreferenceInput!]!): Boolean!

  # Playbooks
  createPlaybook(playbook: PlaybookInput!): Playbook!
  updatePlaybook(id: ID!, playbook: PlaybookInput!): Playbook!
  deletePlaybook(id: ID!): Boolean!
  createPlaybookRun(playbookRun: PlaybookRunInput!): PlaybookRun!
  updatePlaybookRun(id: ID!, status: String, currentStatus: String): PlaybookRun!
  finishPlaybookRun(id: ID!): Boolean!
  updateChecklist(playbookRunId: ID!, checklistIndex: Int!, items: [ChecklistItemInput!]!): Boolean!
  setChecklistItemState(playbookRunId: ID!, checklistIndex: Int!, itemIndex: Int!, newState: String!): Boolean!
}

# ─── Input Types ─────────────────────────────────────────────────────────────

input UserInput {
  username: String!
  email: String!
  password: String
  firstName: String
  lastName: String
  nickname: String
  position: String
  locale: String
  props: JSON
  notifyProps: JSON
}

input TeamInput {
  displayName: String!
  name: String!
  description: String
  type: TeamType!
  companyName: String
  allowedDomains: String
  allowOpenInvite: Boolean
}

input ChannelInput {
  teamId: ID!
  displayName: String!
  name: String!
  type: ChannelType!
  header: String
  purpose: String
}

input PostInput {
  channelId: ID!
  message: String!
  rootId: ID
  fileIds: [ID!]
  props: JSON
  metadata: JSON
}

input IncomingWebhookInput {
  channelId: ID!
  teamId: ID!
  displayName: String
  description: String
  username: String
  iconURL: String
  channelLocked: Boolean
}

input OutgoingWebhookInput {
  teamId: ID!
  channelId: ID
  triggerWords: [String!]!
  triggerWhen: Int
  callbackUrls: [String!]!
  displayName: String
  description: String
  contentType: String
  username: String
  iconURL: String
}

input CommandInput {
  teamId: ID!
  trigger: String!
  method: String!
  url: String!
  username: String
  iconURL: String
  autoComplete: Boolean
  autoCompleteDesc: String
  autoCompleteHint: String
  displayName: String!
  description: String
}

input OAuth2AppInput {
  name: String!
  description: String
  iconURL: String
  callbackUrls: [String!]!
  homepage: String!
  isTrusted: Boolean
}

input EmojiInput {
  creatorId: ID!
  name: String!
}

input BotInput {
  username: String!
  displayName: String
  description: String
}

input PreferenceInput {
  userId: ID!
  category: String!
  name: String!
  value: String!
}

input PlaybookInput {
  title: String!
  description: String
  teamId: ID!
  public: Boolean
  checklists: [ChecklistInput!]
  inviteUsersEnabled: Boolean
  invitedUserIds: [ID!]
  broadcastChannelIds: [ID!]
  webhookOnCreationURLs: [String!]
  retrospectiveEnabled: Boolean
  retrospectiveTemplate: String
}

input ChecklistInput {
  title: String!
  items: [ChecklistItemInput!]!
}

input ChecklistItemInput {
  title: String!
  description: String
  command: String
  assigneeId: ID
  dueDate: DateTime
}

input PlaybookRunInput {
  name: String!
  playbookId: ID!
  ownerUserId: ID!
  teamId: ID!
  channelId: ID
  postId: ID
}
