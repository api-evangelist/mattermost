"""
Mattermost GraphQL Schema
Conceptual schema derived from the Mattermost REST API v4.
Source: https://api.mattermost.com/
"""

scalar DateTime
scalar JSON
scalar Upload

# ─── Users & Sessions ───────────────────────────────────────────────────────

type User {
  id: ID!
  createAt: DateTime!
  updateAt: DateTime!
  deleteAt: DateTime
  username: String!
  email: String!
  emailVerified: Boolean!
  nickname: String
  firstName: String
  lastName: String
  position: String
  roles: String!
  locale: String
  props: JSON
  notifyProps: NotifyProps
  lastPictureUpdate: DateTime
  failedAttempts: Int
  mfaActive: Boolean!
  timezone: Timezone
  remoteId: String
  isBot: Boolean!
  botDescription: String
  botLastIconUpdate: DateTime
}

type UserProfile {
  id: ID!
  username: String!
  email: String!
  nickname: String
  firstName: String
  lastName: String
  position: String
  roles: String!
  locale: String
  timezone: Timezone
  isBot: Boolean!
  lastPictureUpdate: DateTime
}

type UserSession {
  id: ID!
  token: String!
  createAt: DateTime!
  lastActivityAt: DateTime!
  userId: ID!
  deviceId: String
  roles: String!
  isOauth: Boolean!
  props: JSON
  teamMembers: [TeamMember!]
  expireAt: DateTime
}

type Status {
  userId: ID!
  status: String!
  manual: Boolean!
  lastActivityAt: DateTime!
  activeChannel: String
  dndEndTime: DateTime
}

type NotifyProps {
  email: String
  push: String
  desktop: String
  desktopSound: String
  mentionKeys: String
  channel: String
  firstName: String
  pushStatus: String
  comments: String
  autoResponderActive: String
  autoResponderMessage: String
}

type Timezone {
  useAutomaticTimezone: Boolean!
  automaticTimezone: String
  manualTimezone: String
}

type Preferences {
  userId: ID!
  items: [Preference!]!
}

type Preference {
  userId: ID!
  category: String!
  name: String!
  value: String!
}

# ─── Teams ───────────────────────────────────────────────────────────────────

type Team {
  id: ID!
