apis:
- aid: mattermost:rest-api
  name: Mattermost REST API
  description: REST API v4 for managing users, teams, channels, posts, threads, files,
    integrations, plugins, webhooks, slash commands, and OAuth applications. Authentication
    uses Personal Access Tokens or session tokens via Bearer authentication.
  humanURL: https://api.mattermost.com/
  baseURL: https://your-mattermost-server.com/api/v4
  tags:
  - Messaging
  - Users
  - Teams
  - Channels
  - Posts
  - Webhooks
  - Integrations
  properties:
  - type: Documentation
    url: https://api.mattermost.com/
  - type: APIReference
    url: https://developers.mattermost.com/integrate/reference/rest-api/
  - type: OpenAPI Source
    url: https://github.com/mattermost/mattermost-api-reference
  - type: Developer Guide
    url: https://developers.mattermost.com/contribute/more-info/server/rest-api/
  - url: graphql/mattermost-graphql.md
    type: GraphQL
- aid: mattermost:websocket-api
  name: Mattermost WebSocket API
  description: Real-time WebSocket event stream for Mattermost v4. Clients connect
    to /api/v4/websocket, authenticate via cookie, Authorization header, or an authentication_challenge
    action, and receive event envelopes (event, data, broadcast, seq) covering posts,
    channels, users, teams, reactions, typing, status, threads, plugins, and more.
    Client actions user_typing, get_statuses, and get_statuses_by_ids are supported
    over the same socket.
  humanURL: https://developers.mattermost.com/api-documentation
  baseURL: wss://your-mattermost-server.com/api/v4/websocket
  tags:
  - WebSocket
  - Events
  - Real-Time
  - Messaging
  - AsyncAPI
  properties:
