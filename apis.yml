aid: mattermost
name: Mattermost
description: Mattermost is an open-source collaboration platform for technical teams
  that combines secure team messaging, workflow automation, voice/video calling, and
  integrations as a self-hosted Slack alternative. The Mattermost REST API exposes
  full programmatic control over users, teams, channels, posts, files, integrations,
  plugins, and webhooks.
type: Index
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Messaging
- Collaboration
- Team Chat
- Open Source
- DevOps
- Self-Hosted
